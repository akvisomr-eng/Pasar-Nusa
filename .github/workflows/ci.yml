name: Pasar-Nusa CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Dependency audit (report only)
        run: npm audit --json || true
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Static export compatibility check
        run: npm run build:static
      - name: Verify exported routes and assets
        run: node scripts/verify-static-export.mjs
      - name: Verify embedded storefront JavaScript
        run: npm run verify:edge
      - name: Smoke test live Supabase website endpoint
        env:
          SITE_URL: https://nkigwyxbcshavhjmbuey.supabase.co/functions/v1/pasar-nusa-web
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 --output "$response_file" --write-out '%{http_code}' "$SITE_URL")"
          test "$status" = "200"
          grep -qi 'Pasar Nusa' "$response_file"
          grep -qi 'Belanja hasil bumi' "$response_file"
          grep -qi 'Jelajahi produk' "$response_file"
          echo "Legacy endpoint resolves to the current storefront (HTTP $status)."
      - name: Upload static build artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: pasar-nusa-static-preview
          path: out/
          if-no-files-found: error
          retention-days: 7

name: Pasar Nusa — Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate public Supabase configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Set repository variable NEXT_PUBLIC_SUPABASE_URL."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Set repository variable NEXT_PUBLIC_SUPABASE_ANON_KEY to the publishable/anon key."; exit 1; }
          case "$NEXT_PUBLIC_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "::error::Supabase URL must use HTTPS and a Supabase project host."; exit 1;; esac
          case "$NEXT_PUBLIC_SUPABASE_ANON_KEY" in sb_publishable_*) ;; eyJ*) ;; *) echo "::error::Use only a publishable/anon key, never a service-role/secret key."; exit 1;; esac

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static Next.js frontend
        run: npm run build:static
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PASAR_NUSA_BASE_PATH: /Pasar-Nusa
          NEXT_PUBLIC_BASE_PATH: /Pasar-Nusa

      - name: Verify static routes and Supabase browser configuration
        run: |
          node scripts/verify-static-export.mjs
          node scripts/verify-configured-static-export.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare GitHub Pages fallback
        run: cp out/index.html out/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published storefront revision
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          verify_url() {
            url="$1"
            label="$2"
            attempt=1
            while [ "$attempt" -le 12 ]; do
              if curl --fail --silent --show-error --location --max-time 30 "$url" -o /tmp/pasar-nusa-live.html 2>/dev/null &&
                grep -q 'data-build="pasar-nusa-modern-storefront-2026-10-11"' /tmp/pasar-nusa-live.html; then
                echo "Verified $label serves the expected storefront revision."
                return 0
              fi
              echo "Waiting for $label to serve the deployed revision (attempt $attempt/12)..."
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "::error::$label did not serve the expected storefront revision."
            return 1
          }
          verify_url "$SITE_URL" "GitHub Pages"

          CATALOG_URL="${SITE_URL%/}/katalog/"
          if ! curl --fail --silent --show-error --location --max-time 30 "$CATALOG_URL" -o /tmp/pasar-nusa-catalog.html; then
            echo "::error::GitHub Pages catalog route is not reachable: $CATALOG_URL"
            exit 1
          fi
          grep -q 'data-build="pasar-nusa-shared-storefront-2026-10-12"' /tmp/pasar-nusa-catalog.html
          if grep -Eqi 'href=["\x27]https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?' /tmp/pasar-nusa-live.html /tmp/pasar-nusa-catalog.html; then
            echo "::error::Published pages contain a localhost link."
            exit 1
          fi
          echo "Verified catalog route and checked homepage/catalog for localhost links."

          FAVICON_URL="${SITE_URL%/}/favicon.svg"
          attempt=1
          while [ "$attempt" -le 12 ]; do
            if curl --fail --silent --show-error --location --max-time 30 "$FAVICON_URL" -o /tmp/pasar-nusa-favicon.svg 2>/dev/null &&
              grep -q '<svg' /tmp/pasar-nusa-favicon.svg; then
              echo "Verified GitHub Pages serves the favicon at $FAVICON_URL."
              exit 0
            fi
            echo "Waiting for the published favicon (attempt $attempt/12)..."
            sleep 5
            attempt=$((attempt + 1))
          done
          echo "::error::GitHub Pages favicon was not served at $FAVICON_URL."
          exit 1
